<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell – CampusMart</title>
<link rel="stylesheet" href="/css/style.css"></head><body ><header class="nav" id="nav"></header><main><form class="card form" id="f" style="max-width:640px"><h2>List a product</h2><label>Photos (up to 5)</label><input type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple required><label>Title</label><input name="title" maxlength="120" required><label>Description</label><textarea name="description" rows="4" required></textarea>
<label>Category</label><select name="category"></select><label>Subcategory (optional)</label><input name="subcategory"><label>Price (₹)</label><input name="price" type="number" min="1" step="1" required><label>Condition</label><select name="condition"></select><label>College</label><input name="college" required><p class="err" id="err"></p><button class="btn">Publish</button></form></main><footer id="foot"></footer>
<script src="/js/common.js"></script><script src="/js/sell.js"></script></body></html>
